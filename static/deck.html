<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Our Song deck</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--surface:#1F1F1F;--text:#fff;--text3:#8C8B88;--aura:#BD35FC;--deep:#8A2BE2;--gold:#FFC700;--coral:#FF7F50;--coin:#E4C078;--r:16px;font-size:18px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"proxima-nova",Montserrat,Inter,-apple-system,"Helvetica Neue",Arial,sans-serif;padding:16px}
h1{font-weight:800;font-size:1.6rem;letter-spacing:-.02em;margin:0 0 4px}
p.sub{color:var(--text3);margin:0 0 16px}
.bar{display:flex;gap:8px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
button{font:inherit;font-weight:700;background:#fff;color:#000;border:0;border-radius:12px;padding:10px 18px;cursor:pointer}
button:active{background:linear-gradient(90deg,var(--aura),var(--deep));color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.scene{perspective:900px}
.card{position:relative;aspect-ratio:2/3;border-radius:var(--r);overflow:hidden;background:var(--surface);transform-style:preserve-3d;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .15s ease-out,box-shadow .2s}
.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.card .frame{position:absolute;inset:0;border:2px solid rgba(189,53,252,.35);border-radius:var(--r);pointer-events:none}
.card .name{position:absolute;left:0;right:0;bottom:0;padding:10px 10px 12px;font-weight:800;font-size:1.05rem;line-height:1;letter-spacing:-.01em;text-shadow:0 2px 8px #000;background:linear-gradient(transparent,rgba(0,0,0,.75))}
.card .cat{position:absolute;top:8px;left:8px;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.6);display:grid;place-items:center;font-size:15px}
.card .badge{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;border:2px solid rgba(255,255,255,.25);display:grid;place-items:center;font-weight:800;font-size:.8rem;transition:all .3s}
.card.match .badge{background:var(--gold);border-color:var(--gold);color:#000;box-shadow:0 0 18px var(--gold)}
.card.match{box-shadow:0 0 24px rgba(255,199,0,.45)}
.card.yours .badge{background:var(--aura);border-color:var(--aura);color:#fff;box-shadow:0 0 14px var(--aura)}
.card .glare{position:absolute;inset:0;mix-blend-mode:screen;pointer-events:none;background:radial-gradient(circle at calc(50% + var(--px,0)*60%) calc(50% + var(--py,0)*60%),rgba(255,255,255,.22),transparent 55%)}
.hero{max-width:300px;margin:0 auto 20px}
.hero .card{box-shadow:0 0 30px rgba(189,53,252,.35)}
.line{text-align:center;color:var(--text3);margin:10px 0 0;font-size:1rem}
</style></head><body>
<h1>The deck</h1>
<p class="sub">45 cards, each backed by a Qloo tag or audience that returns real artists. Drag across a card to tilt it. Tap to see a match.</p>
<div class="bar"><button onclick="bump(1)">Bigger text</button><button onclick="bump(-1)">Smaller</button><button onclick="matchRandom()">Light up 2 matches</button></div>
<div class="hero scene"><div class="card tilt" id="qlou"><img src="static/deck/qlou.jpg" alt=""><div class="glare"></div><div class="frame"></div><div class="name">Q-Lou</div></div><p class="line">The genie in the jukebox. One wish, the song you both love.</p></div>
<div class="grid" id="grid"></div>
<script>
const ICON={life:"✦",music:"♪",film:"▶",screen:"▣",mic:"🎙",book:"▤",game:"◎",table:"◒",place:"⌂",heart:"♥"};
let cards=[{"id":1,"name":"Early bird","cat":"life","img":"static/deck/01_early_bird.jpg"},{"id":2,"name":"Night owl","cat":"life","img":"static/deck/02_night_owl.jpg"},{"id":3,"name":"Road trips","cat":"life","img":"static/deck/03_road_trips.jpg"},{"id":4,"name":"Live music","cat":"life","img":"static/deck/04_live_music.jpg"},{"id":5,"name":"Dog person","cat":"life","img":"static/deck/05_dog_person.jpg"},{"id":6,"name":"Cat person","cat":"life","img":"static/deck/06_cat_person.jpg"},{"id":7,"name":"Home cook","cat":"life","img":"static/deck/07_home_cook.jpg"},{"id":8,"name":"Takeout night","cat":"life","img":"static/deck/08_takeout_night.jpg"},{"id":9,"name":"Gym rat","cat":"life","img":"static/deck/09_gym_rat.jpg"},{"id":10,"name":"Trail head","cat":"life","img":"static/deck/10_trail_head.jpg"},{"id":11,"name":"Bookworm","cat":"book","img":"static/deck/11_bookworm.jpg"},{"id":12,"name":"Gamer","cat":"game","img":"static/deck/12_gamer.jpg"},{"id":13,"name":"Fix it myself","cat":"life","img":"static/deck/13_fix_it_myself.jpg"},{"id":14,"name":"Thrift find","cat":"life","img":"static/deck/14_thrift_find.jpg"},{"id":15,"name":"Big spender","cat":"life","img":"static/deck/15_big_spender.jpg"},{"id":16,"name":"Saver","cat":"life","img":"static/deck/16_saver.jpg"},{"id":17,"name":"Spiritual","cat":"life","img":"static/deck/17_spiritual.jpg"},{"id":18,"name":"Science nerd","cat":"life","img":"static/deck/18_science_nerd.jpg"},{"id":19,"name":"Country roads","cat":"music","img":"static/deck/19_country_roads.jpg"},{"id":20,"name":"Hip hop head","cat":"music","img":"static/deck/20_hip_hop_head.jpg"},{"id":21,"name":"Rock and roll","cat":"music","img":"static/deck/21_rock_and_roll.jpg"},{"id":22,"name":"Pop star","cat":"music","img":"static/deck/22_pop_star.jpg"},{"id":23,"name":"Jazz hands","cat":"music","img":"static/deck/23_jazz_hands.jpg"},{"id":24,"name":"Metal","cat":"music","img":"static/deck/24_metal.jpg"},{"id":25,"name":"Indie kid","cat":"music","img":"static/deck/25_indie_kid.jpg"},{"id":26,"name":"EDM","cat":"music","img":"static/deck/26_edm.jpg"},{"id":27,"name":"Oldies","cat":"music","img":"static/deck/27_oldies.jpg"},{"id":28,"name":"Latin heat","cat":"music","img":"static/deck/28_latin_heat.jpg"},{"id":29,"name":"Gospel","cat":"music","img":"static/deck/29_gospel.jpg"},{"id":30,"name":"Singer songwriter","cat":"music","img":"static/deck/30_singer_songwriter.jpg"},{"id":37,"name":"Sports fan","cat":"life","img":"static/deck/37_sports_fan.jpg"},{"id":41,"name":"Whiskey","cat":"table","img":"static/deck/41_whiskey.jpg"},{"id":42,"name":"Craft beer","cat":"table","img":"static/deck/42_craft_beer.jpg"},{"id":43,"name":"Wine night","cat":"table","img":"static/deck/43_wine_night.jpg"},{"id":44,"name":"Coffee snob","cat":"table","img":"static/deck/44_coffee_snob.jpg"},{"id":45,"name":"Taco Tuesday","cat":"table","img":"static/deck/45_taco_tuesday.jpg"},{"id":46,"name":"Pizza","cat":"table","img":"static/deck/46_pizza.jpg"},{"id":47,"name":"Small town","cat":"place","img":"static/deck/47_small_town.jpg"},{"id":48,"name":"Big city","cat":"place","img":"static/deck/48_big_city.jpg"},{"id":49,"name":"Family first","cat":"heart","img":"static/deck/49_family_first.jpg"},{"id":50,"name":"Single and fine","cat":"heart","img":"static/deck/50_single_and_fine.jpg"},{"id":51,"name":"Old soul","cat":"heart","img":"static/deck/51_old_soul.jpg"},{"id":52,"name":"Wanderlust","cat":"place","img":"static/deck/52_wanderlust.jpg"},{"id":53,"name":"Homebody","cat":"heart","img":"static/deck/53_homebody.jpg"},{"id":54,"name":"Volunteer","cat":"heart","img":"static/deck/54_volunteer.jpg"}];
render();
function render(){const g=document.getElementById("grid");g.innerHTML="";for(const c of cards){const s=document.createElement("div");s.className="scene";s.innerHTML=`<div class="card tilt" data-id="${c.id}"><img src="${c.img}" alt=""><div class="glare"></div><div class="frame"></div><div class="cat">${ICON[c.cat]||"✦"}</div><div class="badge"></div><div class="name">${c.name}</div></div>`;g.appendChild(s)}wire()}
function wire(){document.querySelectorAll(".tilt").forEach(card=>{card.addEventListener("pointermove",e=>{const r=card.getBoundingClientRect();const px=(e.clientX-r.left)/r.width-.5,py=(e.clientY-r.top)/r.height-.5;set(card,px,py)});card.addEventListener("pointerleave",()=>set(card,0,0));card.addEventListener("click",()=>{if(card.classList.contains("match")){card.classList.remove("match");card.classList.add("yours")}else if(card.classList.contains("yours")){card.classList.remove("yours")}else{card.classList.add("match")}const b=card.querySelector(".badge");if(b)b.textContent=card.classList.contains("match")?"★":card.classList.contains("yours")?"you":""})})}
function set(card,px,py){card.style.setProperty("--px",px);card.style.setProperty("--py",py);card.style.setProperty("--ry",(px*18)+"deg");card.style.setProperty("--rx",(-py*18)+"deg")}
let gyro=false;function enableGyro(){if(gyro)return;const go=()=>{gyro=true;window.addEventListener("deviceorientation",e=>{const px=Math.max(-.5,Math.min(.5,(e.gamma||0)/40)),py=Math.max(-.5,Math.min(.5,((e.beta||45)-45)/40));document.querySelectorAll(".tilt").forEach(c=>set(c,px,py))})};if(typeof DeviceOrientationEvent!=="undefined"&&DeviceOrientationEvent.requestPermission){DeviceOrientationEvent.requestPermission().then(s=>{if(s==="granted")go()}).catch(()=>{})}else go()}
document.body.addEventListener("click",enableGyro,{once:true});
function bump(d){const r=document.documentElement;const cur=parseFloat(getComputedStyle(r).fontSize);r.style.fontSize=Math.max(14,Math.min(30,cur+2*d))+"px"}
function matchRandom(){document.querySelectorAll("#grid .card").forEach(c=>{c.classList.remove("match","yours");c.querySelector(".badge").textContent=""});const all=[...document.querySelectorAll("#grid .card")];for(let i=0;i<2;i++){const c=all[Math.floor(Math.random()*all.length)];c.classList.add("match");c.querySelector(".badge").textContent="★"}}
</script></body></html>
